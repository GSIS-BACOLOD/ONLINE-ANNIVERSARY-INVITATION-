<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSIS Bacolod | 60th Anniversary</title>

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy-dark: #020C1B;
            --navy-deep: #0A192F;
            --navy-light: #112240;
            --silver-light: #F8F9FA;
            --silver-accent: #E6F1FF;
            --silver-metallic: linear-gradient(135deg, #E0E0E0 0%, #FFFFFF 50%, #B0B0B0 100%);
            --silver-glow: rgba(224, 224, 224, 0.4);
            /* Complex Navy Fresco Texture */
            --envelope-navy: #112240;
            --envelope-texture: 
                radial-gradient(circle at 50% 50%, rgba(23, 42, 69, 0.6) 0%, rgba(17, 34, 64, 0) 80%),
                linear-gradient(135deg, #162a47 0%, #112240 50%, #0f1b2d 100%);
            --envelope-shadow: 
                inset 0 2px 3px rgba(230, 241, 255, 0.15),
                inset 0 -3px 5px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--navy-dark);
            color: var(--silver-light);
            overflow-x: hidden;
            position: relative;
        }

        @media (min-height: 650px) and (min-width: 768px) {
            html, body {
                height: 100%;
                overflow: hidden;
            }
        }

        /* Canvas for Silver Glitter Animation */
        #glitterCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Ambient Navy Overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 30%, rgba(17, 34, 64, 0.8) 0%, rgba(2, 12, 27, 0.95) 70%),
                linear-gradient(rgba(2, 12, 27, 0.75), rgba(10, 25, 47, 0.85));
            backdrop-filter: blur(2px);
            z-index: 0;
        }

        /* Rotating Background Logo */
        .bg-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            max-width: 80vw;
            height: auto;
            opacity: 0.12;
            z-index: 1;
            pointer-events: none;
            animation: rotateLogo 40s linear infinite;
        }

        @keyframes rotateLogo {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* Hero Content */
        .hero {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 15px 30px;
        }

        .hero-content {
            width: 100%;
            max-width: 850px;
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Executive Header Typography --- */
        .small-text {
            font-family: 'Cinzel', serif;
            font-size: 1.75rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 10px;
            margin-bottom: 5px;
            padding-bottom: 12px;
            position: relative;
            background: linear-gradient(135deg, #FFFFFF 0%, #D1D5DB 40%, #9CA3AF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
        }

        /* Subtle underline accent for executive look */
        .small-text::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(230, 241, 255, 0.6), transparent);
        }

        .title {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            font-weight: 800;
            margin-top: 10px;
            letter-spacing: 2px;
            background: var(--silver-metallic);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        .subtitle {
            color: #CCD6F6;
            font-size: 1rem;
            letter-spacing: 2px;
            margin-top: 8px;
            margin-bottom: 40px;
            font-weight: 300;
        }

        /******************************
        Envelope Styling (Fresco Navy)
        ******************************/
        .envelope-wrapper {
            display: flex;
            justify-content: center;
            cursor: pointer;
            margin-top: 10px;
            animation: float 3.5s ease-in-out infinite;
        }

        .envelope {
            position: relative;
            width: 320px;
            height: 210px;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.8));
            transition: transform 0.4s ease;
        }

        .envelope:hover {
            transform: scale(1.05) translateY(-5px);
        }

        .envelope-back {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: var(--envelope-texture);
            border: 1px solid rgba(192, 192, 192, 0.2);
            border-radius: 10px;
            box-shadow: var(--envelope-shadow);
        }

        /* Common Flap styles for textured look */
        .envelope-left, .envelope-right, .envelope-bottom, .flap {
            box-shadow: var(--envelope-shadow);
        }

        .envelope-left {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 0;
            border-top: 105px solid transparent;
            border-bottom: 105px solid transparent;
            border-right: 160px solid #1a2f4f; /* Slightly lighter inner fresco */
            border-radius: 10px 0 0 10px;
            filter: drop-shadow(2px 0 2px rgba(0,0,0,0.3));
        }

        .envelope-right {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 0;
            height: 0;
            border-top: 105px solid transparent;
            border-bottom: 105px solid transparent;
            border-left: 160px solid #142641; /* Deeper fresco */
            border-radius: 0 10px 10px 0;
            filter: drop-shadow(-2px 0 2px rgba(0,0,0,0.3));
        }

        .envelope-bottom {
            position: absolute;
            bottom: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 120px solid #0c1829; /* Darkest bottom fresco */
            border-radius: 0 0 10px 10px;
            filter: drop-shadow(0 -2px 3px rgba(0,0,0,0.4));
        }

        .flap {
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-bottom: 120px solid #233554; /* Light top flap */
            transform-origin: top;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 3;
            filter: drop-shadow(0 4px 5px rgba(0,0,0,0.5));
            border-radius: 10px 10px 0 0;
        }

        /* Metallic Silver Wax Seal */
        .seal {
            position: absolute;
            top: 95px;
            left: 50%;
            transform: translateX(-50%);
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: var(--silver-metallic);
            border: 3px solid #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--navy-dark);
            font-family: 'Cinzel', serif;
            font-weight: 800;
            font-size: 24px;
            transition: all 0.5s ease, border-color 0.3s ease;
            box-shadow: 
                0 0 25px rgba(255, 255, 255, 0.5), 
                inset 0 0 15px rgba(0,0,0,0.3),
                0 4px 10px rgba(0,0,0,0.5);
            z-index: 4;
        }

        .seal::before {
            content: '';
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .envelope:hover .seal {
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.7), inset 0 0 15px rgba(0,0,0,0.3);
            border-color: var(--silver-accent);
        }

        .shadow {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%) scaleX(1);
            width: 240px;
            height: 25px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            filter: blur(12px);
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        .envelope:hover + .click-text + .shadow,
        .envelope:hover .shadow {
             transform: translateX(-50%) scaleX(1.1);
             opacity: 0.8;
        }

        .click-text {
            margin-top: 45px;
            color: var(--silver-bright);
            letter-spacing: 3px;
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: 500;
            opacity: 0.85;
            animation: pulseText 2s infinite;
            text-shadow: 0 0 10px var(--silver-glow);
        }

        /******************************
        Animations & Open States
        *****************************/
        .open .flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .open .seal {
            opacity: 0;
            transform: translateX(-50%) scale(0) rotate(-45deg);
        }

        .fade-out {
            animation: fadeOut 0.9s forwards ease-in-out;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: scale(1.08);
            }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        /******************************
        Mobile Responsiveness
        *****************************/
        @media (max-width: 768px) {
            .bg-logo {
                width: 380px;
            }

            .small-text {
                font-size: 0.85rem;
                letter-spacing: 5px;
                margin-bottom: 50px;
            }

            .title {
                font-size: 2.3rem;
            }

            .subtitle {
                font-size: 0.88rem;
                margin-bottom: 30px;
            }

            .envelope {
                transform: scale(0.85);
            }

            .envelope:hover {
                transform: scale(0.88) translateY(-5px);
            }

            .click-text {
                margin-top: 30px;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .bg-logo {
                width: 300px;
            }

            .small-text {
                font-size: 0.75rem;
                letter-spacing: 3px;
                margin-bottom: 20px;
            }

            .title {
                font-size: 1.8rem;
            }

            .envelope {
                transform: scale(0.75);
            }

            .envelope:hover {
                transform: scale(0.78) translateY(-5px);
            }
        }
    </style>
</head>

<body>

    <!-- Silver Glitter Background Canvas -->
    <canvas id="glitterCanvas"></canvas>

    <!-- Rotating Background Logo -->
    <img src="logo.png" class="bg-logo" alt="GSIS Background Logo" onerror="this.src='https://via.placeholder.com/500/112240/FFFFFF?text=GSIS+Logo'">

    <div class="container hero">
        <div class="hero-content">

            <!-- Placed strictly at top with elevated styling -->
            <div class="small-text">Government Service Insurance System</div>

            <!-- Envelope Component -->
            <div id="envelopeWrapper" class="envelope-wrapper">
                <div class="envelope">
                    <div class="shadow"></div>
                    <div class="envelope-back"></div>
                    <div class="envelope-left"></div>
                    <div class="envelope-right"></div>
                    <div class="envelope-bottom"></div>
                    <div class="flap"></div>
                    <div class="seal">60</div>
                </div>
            </div>

            <div class="click-text">Click the invitation to open</div>

        </div>
    </div>

    <!-- JavaScript Navigation & Glitter Animation -->
    <script>
        // Envelope Open & Redirect
        const wrapper = document.getElementById("envelopeWrapper");

        wrapper.onclick = function () {
            const envelope = document.querySelector(".envelope");

            envelope.classList.add("open");

            setTimeout(() => {
                document.body.classList.add("fade-out");
            }, 700);

            setTimeout(() => {
                window.location.href = "event.html";
            }, 1500);
        };

        // Dynamic Silver Glitter Particle System
        const canvas = document.getElementById('glitterCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedY = -(Math.random() * 0.4 + 0.1);
                this.speedX = (Math.random() - 0.5) * 0.2;
                this.opacity = Math.random();
                this.fadeSpeed = Math.random() * 0.015 + 0.005;
                this.fadeDirection = Math.random() > 0.5 ? 1 : -1;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;

                this.opacity += this.fadeSpeed * this.fadeDirection;
                if (this.opacity >= 1) {
                    this.opacity = 1;
                    this.fadeDirection = -1;
                } else if (this.opacity <= 0) {
                    this.opacity = 0;
                    this.fadeDirection = 1;
                }

                if (this.y < 0 || this.x < 0 || this.x > width) {
                    this.reset();
                    this.y = height;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(230, 241, 255, ${this.opacity})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
                ctx.fill();
            }
        }

        const particles = [];
        const particleCount = 70;

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animateGlitter() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateGlitter);
        }

        animateGlitter();
    </script>

</body>

</html>
