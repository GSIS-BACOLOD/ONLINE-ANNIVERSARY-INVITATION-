<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSIS Bacolod | 60th Anniversary</title>

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy-dark: #020C1B;
            --navy-deep: #0A192F;
            --navy-light: #112240;
            --silver-light: #F8F9FA;
            --silver-accent: #E6F1FF;
            --silver-metallic: linear-gradient(135deg, #E0E0E0 0%, #FFFFFF 50%, #B0B0B0 100%);
            --silver-glow: rgba(224, 224, 224, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--navy-dark);
            color: var(--silver-light);
            overflow: hidden;
            position: relative;
        }

        /* Canvas for Silver Glitter Animation */
        #glitterCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Ambient Navy Overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 50%, rgba(17, 34, 64, 0.8) 0%, rgba(2, 12, 27, 0.95) 70%),
                linear-gradient(rgba(2, 12, 27, 0.75), rgba(10, 25, 47, 0.85));
            backdrop-filter: blur(2px);
            z-index: 0;
        }

        /* Static Background Logo (Slightly Smaller) */
        .bg-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            max-width: 75vw;
            height: auto;
            opacity: 0.12;
            z-index: 1;
            pointer-events: none;
        }

        /* Hero Container - Full Screen Centering */
        .hero {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero-content {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .click-text {
            margin-bottom: 25px;
            color: var(--silver-light);
            letter-spacing: 3px;
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: 500;
            opacity: 0.85;
            animation: pulseText 2s infinite;
            text-shadow: 0 0 10px var(--silver-glow);
        }

        /* --- Spinning Image Diamond --- */
        .diamond-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            perspective: 1000px;
            padding: 20px;
            position: relative;
        }

        .diamond-container {
            position: relative;
            width: 220px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spinDiamond 8s linear infinite;
            transform-style: preserve-3d;
            transition: transform 0.4s ease;
        }

        .diamond-img {
            width: 200%;
            height: auto;
            object-fit: contain;
            mix-blend-mode: screen; /* Smoothly blends background if image has white edges */
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.5));
            user-select: none;
        }

        .diamond-wrapper:hover .diamond-container {
            animation-play-state: paused;
            transform: scale(1.15);
        }

        /* Shadow beneath the Diamond */
        .diamond-shadow {
            position: absolute;
            bottom: -15px;
            width: 130px;
            height: 18px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            filter: blur(8px);
            animation: pulseShadow 4s ease-in-out infinite;
        }

        /* --- Executive Footer Typography (Anchored to Bottom & Larger) --- */
        .small-text {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
            z-index: 3;
            font-family: 'Cinzel', serif;
            font-size: 1.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 6px;
            padding-bottom: 12px;
            background: linear-gradient(135deg, #FFFFFF 0%, #D1D5DB 40%, #9CA3AF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
        }

        .small-text::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(230, 241, 255, 0.6), transparent);
        }

        /******************************
        Animations & States
        *****************************/
        @keyframes spinDiamond {
            0% {
                transform: rotateY(0deg);
            }
            100% {
                transform: rotateY(360deg);
            }
        }

        @keyframes pulseShadow {
            0%, 100% { transform: scaleX(1); opacity: 0.6; }
            50% { transform: scaleX(0.7); opacity: 0.3; }
        }

        .fade-out {
            animation: fadeOut 0.9s forwards ease-in-out;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: scale(1.08);
            }
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        /******************************
        Mobile Responsiveness
        *****************************/
        @media (max-width: 768px) {
            .bg-logo {
                width: 380px;
            }

            .small-text {
                font-size: 1.15rem;
                letter-spacing: 4px;
                bottom: 25px;
            }

            .diamond-container {
                width: 180px;
                height: 150px;
            }

            .click-text {
                font-size: 0.8rem;
                margin-bottom: 20px;
            }
        }

        @media (max-width: 480px) {
            .bg-logo {
                width: 280px;
            }

            .small-text {
                font-size: 0.9rem;
                letter-spacing: 2px;
                bottom: 20px;
            }

            .diamond-container {
                width: 140px;
                height: 110px;
            }
        }
    </style>
</head>

<body>

    <!-- Silver Glitter Background Canvas -->
    <canvas id="glitterCanvas"></canvas>

    <!-- Static Background Logo -->
    <img src="logo.png" class="bg-logo" alt="GSIS Background Logo" onerror="this.src='https://via.placeholder.com/500/112240/FFFFFF?text=GSIS+Logo'">

    <!-- Perfectly Centered Hero Container -->
    <div class="container hero">
        <div class="hero-content">

            <!-- Instruction Text ABOVE the Diamond -->
            <div class="click-text">Click the diamond to enter event</div>

            <!-- 3D Spinning Diamond Component -->
            <div id="diamondWrapper" class="diamond-wrapper">
                <div class="diamond-container">
                    <img src="diamond.png" class="diamond-img" alt="Spinning Diamond">
                </div>
                <div class="diamond-shadow"></div>
            </div>

        </div>
    </div>

    <!-- Government Service Insurance System Text (Fixed at Bottom) -->
    <div class="small-text">Government Service Insurance System</div>

    <!-- JavaScript Navigation & Glitter Animation -->
    <script>
        // Diamond Click & Redirect
        const diamondWrapper = document.getElementById("diamondWrapper");

        diamondWrapper.onclick = function () {
            document.body.classList.add("fade-out");

            setTimeout(() => {
                window.location.href = "event.html";
            }, 800);
        };

        // Dynamic Silver Glitter Particle System
        const canvas = document.getElementById('glitterCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedY = -(Math.random() * 0.4 + 0.1);
                this.speedX = (Math.random() - 0.5) * 0.2;
                this.opacity = Math.random();
                this.fadeSpeed = Math.random() * 0.015 + 0.005;
                this.fadeDirection = Math.random() > 0.5 ? 1 : -1;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;

                this.opacity += this.fadeSpeed * this.fadeDirection;
                if (this.opacity >= 1) {
                    this.opacity = 1;
                    this.fadeDirection = -1;
                } else if (this.opacity <= 0) {
                    this.opacity = 0;
                    this.fadeDirection = 1;
                }

                if (this.y < 0 || this.x < 0 || this.x > width) {
                    this.reset();
                    this.y = height;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(230, 241, 255, ${this.opacity})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
                ctx.fill();
            }
        }

        const particles = [];
        const particleCount = 70;

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animateGlitter() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateGlitter);
        }

        animateGlitter();
    </script>

</body>

</html>
