<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seat Reservation</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Internal CSS: Theme, Responsive & Dust Canvas Styles -->
  <style>
    :root {
      --navy-bg: #0b1325;
      --navy-card: #152238;
      --navy-border: #1e3152;
      --silver-accent: #c0c0c0;
      --silver-bright: #e6e8fa;
      --silver-glow: rgba(192, 192, 192, 0.4);
    }

    body {
      background-color: var(--navy-bg);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }

    /* Silver Dust Canvas Background */
    #dust-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    /* Glassmorphism / Silver Border Card */
    .reservation-card {
      background: var(--navy-card);
      border: 1px solid var(--silver-accent);
      border-radius: 16px;
      box-shadow: 0 0 25px var(--silver-glow);
      backdrop-filter: blur(5px);
      position: relative;
      overflow: visible; /* Allows rotating logo to exceed form boundaries */
      z-index: 1;
    }

    /* Centered Rotating Watermark Logo */
    .rotating-bg-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 750px; /* Big size exceeding form boundaries */
      height: 750px;
      object-fit: contain;
      pointer-events: none;
      z-index: 0;
      opacity: 0.12; /* Subtle background watermark effect */
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.2));
      animation: spin 25s linear infinite;
    }

    @keyframes spin {
      from {
        transform: translate(-50%, -50%) rotate(0deg);
      }
      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    /* Ensure form content stays on top of rotating background */
    .card-content {
      position: relative;
      z-index: 1;
    }

    /* Headers & Accent Styling */
    .title-silver {
      color: var(--silver-bright);
      text-shadow: 0 0 10px var(--silver-glow);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .form-label {
      color: var(--silver-accent);
      font-weight: 600;
    }

    /* Inputs Custom Styling */
    .form-control {
      background-color: #0d172a;
      border: 1px solid var(--navy-border);
      color: #ffffff;
      border-radius: 8px;
    }

    .form-control:focus {
      background-color: #111f38;
      color: #ffffff;
      border-color: var(--silver-bright);
      box-shadow: 0 0 10px var(--silver-glow);
    }

    /* Custom Silver Button */
    .btn-silver {
      background: linear-gradient(135deg, #e6e8fa 0%, #c0c0c0 50%, #8a95a5 100%);
      color: #0b1325;
      font-weight: 700;
      border: none;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px var(--silver-glow);
    }

    .btn-silver:hover {
      background: linear-gradient(135deg, #ffffff 0%, #d8d8d8 50%, #a1abbc 100%);
      box-shadow: 0 0 20px var(--silver-bright);
      color: #000000;
      transform: translateY(-2px);
    }

    /* Outline Back Button */
    .btn-outline-silver {
      background: transparent;
      border: 1px solid var(--silver-accent);
      color: var(--silver-bright);
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-outline-silver:hover {
      background: rgba(192, 192, 192, 0.15);
      border-color: #ffffff;
      color: #ffffff;
      transform: translateY(-2px);
    }

    /* Modal Styling */
    .modal-content.dark-modal {
      background-color: var(--navy-card);
      border: 1px solid var(--silver-accent);
      box-shadow: 0 0 30px var(--silver-glow);
      color: #ffffff;
      border-radius: 16px;
    }

    .invitation-img-preview {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      border: 2px solid var(--silver-accent);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    /* Responsive Mobile Adjustments */
    @media (max-width: 768px) {
      body {
        padding: 20px 10px;
      }

      .reservation-card {
        border-radius: 12px;
        padding: 1.5rem !important;
      }

      .rotating-bg-logo {
        width: 500px;
        height: 500px;
      }

      .title-silver {
        font-size: 1.4rem;
      }
    }

    @media (max-width: 480px) {
      .rotating-bg-logo {
        width: 400px;
        height: 400px;
      }
    }
  </style>
</head>
<body>

  <!-- Silver Dust Particle Background -->
  <canvas id="dust-canvas"></canvas>

  <!-- Hidden iframe target for silent Google Form post -->
  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted){onSubmissionSuccess();}"></iframe>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        
        <!-- Reservation Card -->
        <div class="reservation-card p-4 p-md-5">
          
          <!-- Centered Rotating Watermark Logo -->
          <img src="logo.png" class="rotating-bg-logo" alt="GSIS Rotating Logo" onerror="this.src='https://via.placeholder.com/750/152238/FFFFFF?text=GSIS'">

          <div class="card-content">
            <h2 class="text-center title-silver mb-4">RESERVE YOUR SEAT</h2>
            
            <form id="reservationForm" target="hidden_iframe" method="POST" action="https://docs.google.com/forms/d/e/1FAIpQLSccaUzHjRzifxfcmy7reg0nXPqT9YC6cStTAzLc9uFIm1X8Kw/formResponse" onsubmit="handleFormSubmit(event)">
              
              <!-- Hidden Input fields mapped to Google Form entry IDs -->
              <input type="hidden" name="entry.1420955113" id="googleEntrySeatCount" value="1">
              <input type="hidden" name="entry.1951882069" id="googleEntryNames">

              <!-- Single Name Input Field -->
              <div class="mb-4">
                <label for="fullName" class="form-label">Full Name</label>
                <input type="text" id="fullName" class="form-control form-control-lg" placeholder="Enter your full name" required>
              </div>

              <!-- Submit Button -->
              <button type="submit" id="submitBtn" class="btn btn-silver w-100 py-3 mt-2">
                CONFIRM RESERVATION
              </button>

            </form>

            <!-- Back to Event Page Button -->
            <div class="text-center mt-3 pt-3 border-top border-secondary-subtle">
              <a href="event.html" class="btn btn-outline-silver w-100 py-2">
                <i class="fas fa-arrow-left me-2"></i>Back to Event Details
              </a>
            </div>

            <!-- Success Alert Placeholder -->
            <div id="successAlert" class="alert alert-success mt-4 text-center" style="display: none; background-color: #1a3c34; border-color: #276757; color: #a3ebd3;">
              🎉 Reservation submitted successfully!
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>

  <!-- Invitation Pass Modal -->
  <div class="modal fade" id="invitationModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false" aria-labelledby="invitationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content dark-modal text-center p-3">
        <div class="modal-header border-0 pb-0 justify-content-center">
          <h5 class="modal-title title-silver" id="invitationModalLabel">
            <i class="fas fa-ticket-alt me-2"></i>RESERVATION SUCCESSFUL!
          </h5>
        </div>
        <div class="modal-body">
          <p class="text-light small mb-3">
            Please save or ScreenShot this invitation card as official proof of your seat reservation.
          </p>
          
          <!-- Invitation Image -->
          <div class="my-3">
            <img src="invitation.png" id="invitationImage" class="invitation-img-preview" alt="Invitation Pass" onerror="this.src='https://via.placeholder.com/600x400/152238/FFFFFF?text=Invitation+Pass'">
          </div>

          <!-- Download Action Button -->
          <a href="invitation.png" download="invitation.png" class="btn btn-silver w-100 my-2">
            <i class="fas fa-download me-2"></i>Save / Download Invitation Image
          </a>

          <p class="text-secondary small mt-3 mb-0">
            Redirecting to event details in <span id="countdownTimer" class="fw-bold text-light">8</span> seconds...
          </p>
        </div>
        <div class="modal-footer border-0 pt-0 justify-content-center">
          <button type="button" class="btn btn-outline-silver btn-sm w-100" onclick="redirectToEvent()">
            Done / Proceed to Event <i class="fas fa-arrow-right ms-1"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Internal JavaScript: Dynamic Logic & Particle Animation -->
  <script>
    /* ==========================================================
       1. SUBMISSION STATE & TIMER MANAGEMENT
       ========================================================== */
    let submitted = false;
    let timerInterval = null;

    function redirectToEvent() {
      if (timerInterval) clearInterval(timerInterval);
      window.location.href = "event.html";
    }

    /* ==========================================================
       2. FORM SUBMISSION LOGIC
       ========================================================== */
    function handleFormSubmit(event) {
      const nameInput = document.getElementById("fullName").value.trim();

      // Format name for Google Form entry
      document.getElementById("googleEntryNames").value = `Seat 1: ${nameInput}`;

      // Disable button to prevent duplicate clicks
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "SUBMITTING...";

      // Mark form as submitted so the iframe onload triggers success view
      submitted = true;
    }

    function onSubmissionSuccess() {
      // Show Success Message in background
      const successAlert = document.getElementById("successAlert");
      successAlert.style.display = "block";

      // Reset form controls
      document.getElementById("reservationForm").reset();
      
      // Reset state flag
      submitted = false;

      // Launch Invitation Modal
      const invitationModal = new bootstrap.Modal(document.getElementById('invitationModal'));
      invitationModal.show();

      // Start 8-second countdown timer before automatic redirect
      let secondsLeft = 8;
      const timerElement = document.getElementById("countdownTimer");

      timerInterval = setInterval(function() {
        secondsLeft--;
        if (timerElement) timerElement.innerText = secondsLeft;

        if (secondsLeft <= 0) {
          redirectToEvent();
        }
      }, 1000);
    }

    /* ==========================================================
       3. SILVER DUST ANIMATION CANVAS
       ========================================================== */
    const canvas = document.getElementById('dust-canvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    const particleCount = 70;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = Math.random() * 1.8 + 0.3; // Tiny dust particles
        this.vx = (Math.random() - 0.5) * 0.4;    // Subtle float horizontally
        this.vy = -Math.random() * 0.5 - 0.2;     // Floating slowly upwards
        this.alpha = Math.random() * 0.6 + 0.2;   // Transparency
        this.twinkleSpeed = Math.random() * 0.015 + 0.005;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        // Twinkle effect
        this.alpha += Math.sin(Date.now() * this.twinkleSpeed) * 0.01;

        // Reset particle if it drifts off screen
        if (this.y < 0 || this.x < 0 || this.x > canvas.width) {
          this.reset();
          this.y = canvas.height;
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, this.alpha));
        ctx.fillStyle = '#e6e8fa'; // Silver particle color
        ctx.shadowBlur = 6;
        ctx.shadowColor = '#ffffff'; // Subtle glowing dust
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Initialize particles
    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }

    // Animation Loop
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
